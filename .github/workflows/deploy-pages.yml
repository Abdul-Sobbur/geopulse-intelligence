# Publish the web app, with a fresh copy of the map data, to GitHub Pages on every push to main.
# After loading new data into the database, run it by hand (Actions > Deploy web app > Run workflow).
name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push replaces one that is waiting
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Check the API address is set
        run: |
          if [ -z "${{ vars.API_URL }}" ]; then
            echo "::error::Set the repository variable API_URL (Settings > Secrets and variables > Actions > Variables)"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Map layers are saved as static files next to the app, so the map draws without waiting for the API.
      # Neither step can break the deploy: without them the app simply loads its layers from the API.
      - name: Install tippecanoe (makes the national vector tiles)
        continue-on-error: true
        working-directory: .
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tippecanoe
      - name: Build static map data from the API
        continue-on-error: true
        working-directory: .
        run: python3 scripts/build_map_data.py --api "${{ vars.API_URL }}"
      - name: Build for GitHub Pages
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
